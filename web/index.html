<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EMT Report Assistant</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>EMT Report Assistant</h1>
    <div id="call-picker">
      <label for="call-select">Call:</label>
      <select id="call-select"></select>
      <button id="archive-toggle-btn" class="icon-btn" title="Archive as example">☆</button>
      <button id="delete-call-btn" class="icon-btn" title="Delete this call">🗑</button>
      <button id="new-call-btn">+ New Demo Call</button>
      <a href="/static/watch-mock.html" target="_blank" rel="noopener" class="watch-link">⌚ Watch App Simulator</a>
    </div>
  </header>

  <main>
    <section id="call-summary" class="card">
      <h2>Call Summary</h2>
      <div id="summary-content">Select a call to begin.</div>
      <div id="captured-list"></div>
    </section>

    <section id="narrative-editor" class="card">
      <h2>Report Narrative</h2>
      <p class="hint">Start typing — a gray suggestion will appear inline. Press <kbd>Tab</kbd> to accept it.</p>
      <div class="editor-wrap">
        <div id="ghost-overlay" aria-hidden="true"></div>
        <textarea id="narrative-text" spellcheck="false" placeholder="Report narrative will be auto-drafted here once a call is selected..."></textarea>
      </div>
      <div id="suggestion-source"></div>
      <div class="actions">
        <label for="narrative-format-select" class="format-label">Format:</label>
        <select id="narrative-format-select">
          <option value="standard">Standard</option>
          <option value="soap">SOAP</option>
          <option value="chart">CHART</option>
        </select>
        <button id="load-draft-btn">Load Auto-Draft</button>
        <button id="save-btn">Save</button>
        <button id="finalize-btn" class="primary">Finalize Report</button>
      </div>
      <div id="save-status"></div>
    </section>
  </main>

  <div id="modal-overlay" class="modal-overlay">
    <div id="modal-newcall" class="modal">
      <h3>New Demo Call</h3>
      <label>Chief Complaint
        <input type="text" id="nc-complaint" placeholder="e.g. diabetic emergency">
      </label>
      <label>Patient Age
        <input type="number" id="nc-age" placeholder="e.g. 42">
      </label>
      <label>Patient Sex
        <select id="nc-sex">
          <option value="">Select…</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </label>
      <div class="modal-actions">
        <button id="nc-cancel-btn">Cancel</button>
        <button id="nc-create-btn" class="primary">Start Call</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
